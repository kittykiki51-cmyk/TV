name: Build TV APK

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "website/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "Using release key from repository secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            PW="$KEYSTORE_PASSWORD"
          else
            echo "::warning::KEYSTORE_BASE64 / KEYSTORE_PASSWORD secrets not set - signing with a temporary key. Installs from different runs will not update each other."
            PW=temporary-password
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias release -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PW" -keypass "$PW" -dname "CN=temporary"
          fi
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "keyAlias=release"
            echo "storePassword=$PW"
            echo "sdk.dir=$ANDROID_HOME"
          } > local.properties

      - name: Build leanback (TV) release APK
        run: ./gradlew --no-configuration-cache :app:assembleLeanbackRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-apk
          path: app/build/outputs/apk/leanback/release/*.apk
          if-no-files-found: error
